<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=https://mrsam.me/">
    <link rel="canonical" href="https://mrsam.me/">
    <title>Redirecting...</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Source Code Pro', monospace;
            background: linear-gradient(135deg, #1a1a1a, #000000);
            color: #00ff00;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAAAeQoEGAAAADUlEQVQIW2NkYGDYDwAAAgABGjA/6wAAAABJRU5ErkJggg==') repeat;
            opacity: 0.05;
            pointer-events: none;
            z-index: -1;
        }

        h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.1em;
            color: #00cc00;
        }

        .spinner {
            margin-top: 20px;
            width: 28px;
            height: 28px;
            border: 3px solid rgba(0,255,0,0.2);
            border-top-color: #00ff00;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <h1>// ACCESS_POINT_01 //</h1>
    <p>Automatically redirecting to another address...</p>
    <div class="spinner"></div>
    <noscript>
        <p>If you are not redirected automatically, <a href="https://mrsam.me/" style="color:#00ccff;">click here</a>.</p>
    </noscript>

    <script>
        window.location.replace('https://mrsam.me/');
    </script>

</body>
</html>
